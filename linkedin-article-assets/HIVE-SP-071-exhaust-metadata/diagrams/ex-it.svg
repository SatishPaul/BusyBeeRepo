"800" fill="#1d4ed8">The math: </tspan>A rare pasted error (kernel 753 + ORA-01555) is almost a fingerprint.</text><text x="600" y="524" font-size="15" fill="#0f172a" text-anchor="middle"><tspan font-weight="800" fill="#1d4ed8"></tspan>See it twice and it is the same client system, near-certain.</text></svg>