<svg viewBox="0 0 1200 530" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
<rect width="1200" height="530" fill="#ffffff"/><rect width="1200" height="530" fill="#f8fbff"/>
<rect x="0" y="0" width="10" height="530" fill="#1d4ed8"/>
<text x="600" y="46" font-size="28" font-weight="800" fill="#0f172a" text-anchor="middle">You Do Not Need the Words. You Need the Pattern.</text>
<text x="600" y="76" font-size="16" fill="#64748b" text-anchor="middle">Pick one person in a 65,536-seat stadium. Each yes-or-no cuts it in half.</text>
<rect x="170" y="118" width="470" height="32" rx="6" fill="#dbeafe" stroke="#93c5fd"/><text x="180" y="139" font-size="15" font-weight="800" fill="#1e3a8a">65,536 left</text><text x="154" y="139" font-size="13" fill="#64748b" text-anchor="end">Q1</text><text x="664" y="139" font-size="14" fill="#0f172a">lower bowl?</text><rect x="170" y="164" width="291" height="32" rx="6" fill="#dbeafe" stroke="#93c5fd"/><text x="180" y="185" font-size="15" font-weight="800" fill="#1e3a8a">32,768 left</text><text x="154" y="185" font-size="13" fill="#64748b" text-anchor="end">Q2</text><text x="664" y="185" font-size="14" fill="#0f172a">home side?</text><rect x="170" y="210" width="181" height="32" rx="6" fill="#dbeafe" stroke="#93c5fd"/><text x="180" y="231" font-size="15" font-weight="800" fill="#1e3a8a">16,384 left</text><text x="154" y="231" font-size="13" fill="#64748b" text-anchor="end">Q3</text><text x="664" y="231" font-size="14" fill="#0f172a">jersey on?</text><rect x="170" y="256" width="112" height="32" rx="6" fill="#dbeafe" stroke="#93c5fd"/><text x="180" y="277" font-size="15" font-weight="800" fill="#1e3a8a">8,192 left</text><text x="154" y="277" font-size="13" fill="#64748b" text-anchor="end">Q4</text><text x="664" y="277" font-size="14" fill="#0f172a">female?</text><rect x="170" y="302" width="69" height="32" rx="6" fill="#dbeafe" stroke="#93c5fd"/><text x="180" y="323" font-size="15" font-weight="800" fill="#1e3a8a">4,096 left</text><text x="154" y="323" font-size="13" fill="#64748b" text-anchor="end">Q5</text><text x="664" y="323" font-size="14" fill="#0f172a">under 30?</text><rect x="170" y="348" width="58" height="32" rx="6" fill="#dbeafe" stroke="#93c5fd"/><text x="180" y="369" font-size="15" font-weight="800" fill="#1e3a8a">2,048 left</text><text x="154" y="369" font-size="13" fill="#64748b" text-anchor="end">Q6</text><text x="664" y="369" font-size="14" fill="#0f172a">holding a drink?</text><text x="170" y="412" font-size="20" font-weight="800" fill="#64748b">. . .</text><rect x="170" y="434" width="150" height="34" rx="6" fill="#dc2626"/><text x="245" y="457" font-size="16" font-weight="800" fill="#fff" text-anchor="middle">1 seat left</text><text x="338" y="457" font-size="14.5" fill="#0f172a">16 yes-or-no answers find one person in a full stadium</text><rect x="790" y="118" width="330" height="168" rx="12" fill="#fffbeb" stroke="#fcd34d"/><text x="955" y="150" font-size="17" font-weight="800" fill="#b45309" text-anchor="middle">Why 16 clues is enough</text><text x="955" y="182" font-size="15" fill="#78350f" text-anchor="middle">2 multiplied by itself 16 times</text><text x="955" y="204" font-size="15" fill="#78350f" text-anchor="middle">is 65,536: a whole stadium.</text><text x="955" y="238" font-size="15" fill="#78350f" text-anchor="middle">You never asked the name.</text><text x="955" y="260" font-size="15" fill="#78350f" text-anchor="middle">You only asked about shape.</text><text x="600" y="502" font-size="15" fill="#0f172a" text-anchor="middle">The AI never asks out loud. Your daily usage answers dozens of these clues for it, silently.</text></svg>