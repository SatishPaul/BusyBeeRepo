<svg viewBox="0 0 1200 530" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
<rect width="1200" height="530" fill="#ffffff"/><rect width="1200" height="530" fill="#f8fbff"/>
<rect x="0" y="0" width="10" height="530" fill="#1d4ed8"/>
<text x="600" y="46" font-size="24" font-weight="800" fill="#0f172a" text-anchor="middle">You Do Not Need the Words. You Need the Pattern.</text>
<text x="600" y="74" font-size="13.5" fill="#64748b" text-anchor="middle">Every yes-or-no clue cuts the possibilities in half.</text>
<rect x="150" y="120" width="760" height="32" rx="6" fill="#dbeafe" stroke="#93c5fd"/><text x="160" y="141" font-size="13.5" font-weight="800" fill="#1e3a8a">1,000,000 left</text><text x="134" y="141" font-size="11.5" fill="#64748b" text-anchor="end">clue 1</text><rect x="150" y="166" width="502" height="32" rx="6" fill="#dbeafe" stroke="#93c5fd"/><text x="160" y="187" font-size="13.5" font-weight="800" fill="#1e3a8a">500,000 left</text><text x="134" y="187" font-size="11.5" fill="#64748b" text-anchor="end">clue 2</text><rect x="150" y="212" width="331" height="32" rx="6" fill="#dbeafe" stroke="#93c5fd"/><text x="160" y="233" font-size="13.5" font-weight="800" fill="#1e3a8a">250,000 left</text><text x="134" y="233" font-size="11.5" fill="#64748b" text-anchor="end">clue 3</text><rect x="150" y="258" width="218" height="32" rx="6" fill="#dbeafe" stroke="#93c5fd"/><text x="160" y="279" font-size="13.5" font-weight="800" fill="#1e3a8a">125,000 left</text><text x="134" y="279" font-size="11.5" fill="#64748b" text-anchor="end">clue 4</text><rect x="150" y="304" width="144" height="32" rx="6" fill="#dbeafe" stroke="#93c5fd"/><text x="160" y="325" font-size="13.5" font-weight="800" fill="#1e3a8a">62,500 left</text><text x="134" y="325" font-size="11.5" fill="#64748b" text-anchor="end">clue 5</text><rect x="150" y="350" width="95" height="32" rx="6" fill="#dbeafe" stroke="#93c5fd"/><text x="160" y="371" font-size="13.5" font-weight="800" fill="#1e3a8a">31,250 left</text><text x="134" y="371" font-size="11.5" fill="#64748b" text-anchor="end">clue 6</text><text x="150" y="414" font-size="20" font-weight="800" fill="#64748b">. . .</text><rect x="150" y="436" width="120" height="34" rx="6" fill="#dc2626"/><text x="210" y="459" font-size="14" font-weight="800" fill="#fff" text-anchor="middle">1 secret</text><text x="290" y="459" font-size="13.5" fill="#0f172a">after about 20 halvings, only one answer is left</text><rect x="640" y="120" width="470" height="150" rx="12" fill="#fffbeb" stroke="#fcd34d"/><text x="875" y="152" font-size="15" font-weight="800" fill="#b45309" text-anchor="middle">Why 20 clues is enough</text><text x="875" y="182" font-size="13" fill="#78350f" text-anchor="middle">2 multiplied by itself 20 times</text><text x="875" y="204" font-size="13" fill="#78350f" text-anchor="middle">is about 1,000,000.</text><text x="875" y="238" font-size="13" fill="#78350f" text-anchor="middle">Your firm hands an outside model dozens</text><text x="875" y="258" font-size="13" fill="#78350f" text-anchor="middle">of these clues every single day.</text><text x="600" y="500" font-size="13.5" fill="#0f172a" text-anchor="middle">The clues are not the client file. They are the shape of your work: what you ask, in what order, how often.</text></svg>