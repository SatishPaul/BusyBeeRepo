<svg viewBox="0 0 1200 490" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
<rect width="1200" height="490" fill="#ffffff"/><rect width="1200" height="490" fill="#f8fbff"/>
<rect x="0" y="0" width="10" height="490" fill="#1d4ed8"/>
<text x="600" y="46" font-size="24" font-weight="800" fill="#0f172a" text-anchor="middle">Where the Exhaust Lands Decides Who Owns Your IP</text>
<text x="600" y="74" font-size="13.5" fill="#64748b" text-anchor="middle">The content promise is the same on both sides. The boundary is not.</text>
<rect x="470" y="96" width="260" height="56" rx="12" fill="#0f172a"/><text x="600" y="122" font-size="15" font-weight="800" fill="#fff" text-anchor="middle">YOUR KNOWLEDGE WORK</text><text x="600" y="142" font-size="11" fill="#a9781f" text-anchor="middle">prompts, retrievals, corrections, patterns</text><line x1="500" y1="152" x2="300" y2="230" stroke="#94a3b8" stroke-width="1.6"/><rect x="90" y="230" width="420" height="210" rx="16" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/><text x="300" y="266" font-size="15" font-weight="800" fill="#991b1b" text-anchor="middle">MODEL HOSTED OUTSIDE YOUR TENANT</text><text x="300" y="290" font-size="12" fill="#b91c1c" text-anchor="middle">"we do not train on your data"</text><text x="300" y="326" font-size="13" fill="#7f1d1d" text-anchor="middle">content promise kept, but the exhaust</text><text x="300" y="346" font-size="13" fill="#7f1d1d" text-anchor="middle">lands on their side of the line</text><rect x="150" y="372" width="300" height="44" rx="10" fill="#fff" stroke="#fecaca"/><text x="300" y="399" font-size="13" font-weight="800" fill="#dc2626" text-anchor="middle">LEAK: they learn how you work</text><line x1="700" y1="152" x2="900" y2="230" stroke="#94a3b8" stroke-width="1.6"/><rect x="690" y="230" width="420" height="210" rx="16" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.6"/><text x="900" y="266" font-size="15" font-weight="800" fill="#1e3a8a" text-anchor="middle">MODEL RUNS INSIDE YOUR BOUNDARY</text><text x="900" y="290" font-size="12" fill="#1d4ed8" text-anchor="middle">your tenant, your compliance perimeter</text><text x="900" y="326" font-size="13" fill="#1e40af" text-anchor="middle">prompts, embeddings and telemetry</text><text x="900" y="346" font-size="13" fill="#1e40af" text-anchor="middle">stay on your side of the line</text><rect x="750" y="372" width="300" height="44" rx="10" fill="#fff" stroke="#bfdbfe"/><text x="900" y="399" font-size="13" font-weight="800" fill="#1d4ed8" text-anchor="middle">KEPT: the exhaust becomes your asset</text><text x="600" y="466" font-size="13.5" fill="#0f172a" text-anchor="middle">Same data, opposite outcome, decided entirely by where it runs.</text></svg>