<svg viewBox="0 0 1200 480" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
<rect width="1200" height="480" fill="#ffffff"/><rect width="1200" height="480" fill="#f8fbff"/>
<rect x="0" y="0" width="10" height="480" fill="#047857"/>
<text x="600" y="46" font-size="24" font-weight="800" fill="#0f172a" text-anchor="middle">Encryption Protects the Message, Not the Relationship</text>
<text x="600" y="74" font-size="13.5" fill="#64748b" text-anchor="middle">What end-to-end encryption hides, and what it leaves in the open.</text>
<rect x="80" y="120" width="480" height="300" rx="16" fill="#ecfdf5" stroke="#047857" stroke-width="1.6"/><text x="320" y="156" font-size="16" font-weight="800" fill="#065f46" text-anchor="middle">THE MESSAGE CONTENT</text><text x="320" y="180" font-size="12.5" fill="#0b6a0b" text-anchor="middle">end-to-end encrypted / not trained on</text><rect x="286" y="228" width="68" height="52" rx="8" fill="#047857"/><rect x="300" y="206" width="40" height="34" rx="20" fill="none" stroke="#047857" stroke-width="8"/><circle cx="320" cy="252" r="7" fill="#ecfdf5"/><text x="320" y="330" font-size="14" font-weight="700" fill="#065f46" text-anchor="middle">PROTECTED</text><text x="320" y="356" font-size="12" fill="#0b6a0b" text-anchor="middle">they cannot read the words</text><rect x="640" y="120" width="480" height="300" rx="16" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/><text x="880" y="156" font-size="16" font-weight="800" fill="#991b1b" text-anchor="middle">THE EXHAUST (METADATA)</text><text x="880" y="180" font-size="12.5" fill="#b91c1c" text-anchor="middle">who, when, how often, in what shape</text><rect x="664" y="210" width="216" height="34" rx="8" fill="#ffffff" stroke="#fecaca"/><circle cx="680" cy="227" r="4" fill="#dc2626"/><text x="694" y="231" font-size="12" fill="#7f1d1d">who talks to whom</text><rect x="892" y="210" width="216" height="34" rx="8" fill="#ffffff" stroke="#fecaca"/><circle cx="908" cy="227" r="4" fill="#dc2626"/><text x="922" y="231" font-size="12" fill="#7f1d1d">frequency + timing</text><rect x="664" y="254" width="216" height="34" rx="8" fill="#ffffff" stroke="#fecaca"/><circle cx="680" cy="271" r="4" fill="#dc2626"/><text x="694" y="275" font-size="12" fill="#7f1d1d">prompt + retrieval patterns</text><rect x="892" y="254" width="216" height="34" rx="8" fill="#ffffff" stroke="#fecaca"/><circle cx="908" cy="271" r="4" fill="#dc2626"/><text x="922" y="275" font-size="12" fill="#7f1d1d">embeddings fingerprint</text><rect x="664" y="298" width="216" height="34" rx="8" fill="#ffffff" stroke="#fecaca"/><circle cx="680" cy="315" r="4" fill="#dc2626"/><text x="694" y="319" font-size="12" fill="#7f1d1d">tool-call sequences</text><rect x="892" y="298" width="216" height="34" rx="8" fill="#ffffff" stroke="#fecaca"/><circle cx="908" cy="315" r="4" fill="#dc2626"/><text x="922" y="319" font-size="12" fill="#7f1d1d">volume spikes on a topic</text><text x="880" y="390" font-size="14" font-weight="800" fill="#991b1b" text-anchor="middle">EXPOSED</text><text x="600" y="452" font-size="14" fill="#0f172a" text-anchor="middle"><tspan font-weight="800" fill="#dc2626">Read: </tspan>metadata tells the story; content only fills in the details.</text></svg>