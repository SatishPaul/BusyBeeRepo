<svg viewBox="0 0 1200 540" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
<rect width="1200" height="540" fill="#ffffff"/><rect width="1200" height="540" fill="#f8fbff"/>
<rect x="0" y="0" width="10" height="540" fill="#1d4ed8"/>
<text x="600" y="46" font-size="28" font-weight="800" fill="#0f172a" text-anchor="middle">A Few Clues Turn a Guess Into Near-Certainty</text>
<text x="600" y="76" font-size="16" fill="#64748b" text-anchor="middle">Each clue that fits roughly doubles the confidence.</text>
<rect x="150" y="422.8" width="118" height="7.2" rx="6" fill="#93c5fd"/><text x="209" y="412.8" font-size="18" font-weight="800" fill="#1e3a8a" text-anchor="middle">2%</text><text x="209" y="450" font-size="13.5" fill="#64748b" text-anchor="middle">clue 1</text><rect x="286" y="415.6" width="118" height="14.4" rx="6" fill="#93c5fd"/><text x="345" y="405.6" font-size="18" font-weight="800" fill="#1e3a8a" text-anchor="middle">4%</text><text x="345" y="450" font-size="13.5" fill="#64748b" text-anchor="middle">clue 2</text><rect x="422" y="401.2" width="118" height="28.8" rx="6" fill="#93c5fd"/><text x="481" y="391.2" font-size="18" font-weight="800" fill="#1e3a8a" text-anchor="middle">8%</text><text x="481" y="450" font-size="13.5" fill="#64748b" text-anchor="middle">clue 3</text><rect x="558" y="372.4" width="118" height="57.6" rx="6" fill="#3b82f6"/><text x="617" y="362.4" font-size="18" font-weight="800" fill="#1e3a8a" text-anchor="middle">16%</text><text x="617" y="450" font-size="13.5" fill="#64748b" text-anchor="middle">clue 4</text><rect x="694" y="314.8" width="118" height="115.2" rx="6" fill="#3b82f6"/><text x="753" y="304.8" font-size="18" font-weight="800" fill="#1e3a8a" text-anchor="middle">32%</text><text x="753" y="450" font-size="13.5" fill="#64748b" text-anchor="middle">clue 5</text><rect x="830" y="199.6" width="118" height="230.4" rx="6" fill="#1d4ed8"/><text x="889" y="189.6" font-size="18" font-weight="800" fill="#1e3a8a" text-anchor="middle">64%</text><text x="889" y="450" font-size="13.5" fill="#64748b" text-anchor="middle">clue 6</text><rect x="966" y="84.39999999999998" width="118" height="345.6" rx="6" fill="#1d4ed8"/><text x="1025" y="74.39999999999998" font-size="18" font-weight="800" fill="#1e3a8a" text-anchor="middle">96%</text><text x="1025" y="450" font-size="13.5" fill="#64748b" text-anchor="middle">clue 7</text><line x1="140" y1="430" x2="1090" y2="430" stroke="#cbd5e1"/><text x="600" y="486" font-size="16" fill="#0f172a" text-anchor="middle">Start unsure. Each clue that fits roughly doubles the confidence.</text><text x="600" y="510" font-size="16" fill="#0f172a" text-anchor="middle"><tspan font-weight="800" fill="#dc2626">After about six clues the model is past 90 percent.</tspan> It is not guessing. It knows.</text></svg>