<svg viewBox="0 0 1200 540" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
<rect width="1200" height="540" fill="#ffffff"/><rect width="1200" height="540" fill="#f8fbff"/>
<rect x="0" y="0" width="10" height="540" fill="#a9781f"/>
<text x="600" y="46" font-size="24" font-weight="800" fill="#0f172a" text-anchor="middle">Tax: A Cross-Border Acquisition</text>
<text x="600" y="74" font-size="13.5" fill="#64748b" text-anchor="middle">The deal is locked. The method leaks in the pattern.</text>
<rect x="64" y="100" width="344" height="372" rx="14" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1.6"/><path d="M64,114 a14,14 0 0 1 14,-14 h316 a14,14 0 0 1 14,14 v38 h-344 z" fill="#047857"/><text x="236" y="126" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">SECURED (the content)</text><text x="236" y="144" font-size="10.5" fill="#ffffff" opacity="0.9" text-anchor="middle">locked / not trained on</text><circle cx="86" cy="178" r="4" fill="#047857"/><text x="100" y="182" font-size="12.5" fill="#0f172a">Client and target names</text><circle cx="86" cy="218" r="4" fill="#047857"/><text x="100" y="222" font-size="12.5" fill="#0f172a">The dollar amounts</text><circle cx="86" cy="258" r="4" fill="#047857"/><text x="100" y="262" font-size="12.5" fill="#0f172a">The signed deal terms</text><circle cx="86" cy="298" r="4" fill="#047857"/><text x="100" y="302" font-size="12.5" fill="#0f172a">The actual workpapers</text><rect x="78" y="418" width="316" height="38" rx="8" fill="#ffffff" stroke="#a7f3d0"/><text x="236" y="442" font-size="12.5" font-weight="800" fill="#047857" text-anchor="middle">They never see this</text><rect x="428" y="100" width="344" height="372" rx="14" fill="#fef2f2" stroke="#fecaca" stroke-width="1.6"/><path d="M428,114 a14,14 0 0 1 14,-14 h316 a14,14 0 0 1 14,14 v38 h-344 z" fill="#dc2626"/><text x="600" y="126" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">THE EXHAUST THEY SEE</text><text x="600" y="144" font-size="10.5" fill="#ffffff" opacity="0.9" text-anchor="middle">the shape of your work</text><circle cx="450" cy="178" r="4" fill="#dc2626"/><text x="464" y="182" font-size="12.5" fill="#0f172a">Burst on one basis-step-up rule</text><circle cx="450" cy="218" r="4" fill="#dc2626"/><text x="464" y="222" font-size="12.5" fill="#0f172a">Same 6 templates, same order</text><circle cx="450" cy="258" r="4" fill="#dc2626"/><text x="464" y="262" font-size="12.5" fill="#0f172a">Calc tool then FTC tool, paired</text><circle cx="450" cy="298" r="4" fill="#dc2626"/><text x="464" y="302" font-size="12.5" fill="#0f172a">Late-night spike before quarter close</text><rect x="442" y="418" width="316" height="38" rx="8" fill="#ffffff" stroke="#fecaca"/><text x="600" y="442" font-size="12.5" font-weight="800" fill="#dc2626" text-anchor="middle">Not the file, but it describes the file</text><rect x="792" y="100" width="344" height="372" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1.6"/><path d="M792,114 a14,14 0 0 1 14,-14 h316 a14,14 0 0 1 14,14 v38 h-344 z" fill="#a9781f"/><text x="964" y="126" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">WHAT THE MODEL INFERS</text><text x="964" y="144" font-size="10.5" fill="#ffffff" opacity="0.9" text-anchor="middle">hosted outside: OpenAI / Anthropic</text><circle cx="814" cy="178" r="4" fill="#fbbf24"/><text x="828" y="182" font-size="12.5" fill="#e5e7eb">A repeatable 6-step method</text><circle cx="814" cy="218" r="4" fill="#fbbf24"/><text x="828" y="222" font-size="12.5" fill="#e5e7eb">for cross-border tech deals</text><circle cx="814" cy="258" r="4" fill="#fbbf24"/><text x="828" y="262" font-size="12.5" fill="#e5e7eb">One deal closing this quarter</text><circle cx="814" cy="298" r="4" fill="#fbbf24"/><text x="828" y="302" font-size="12.5" fill="#e5e7eb">= the product clients pay for</text><rect x="806" y="418" width="316" height="38" rx="8" fill="#ffffff" stroke="#334155"/><text x="964" y="442" font-size="12.5" font-weight="800" fill="#a9781f" text-anchor="middle">Your method, learned for free</text><path d="M410,273 L423,286 L410,299" fill="none" stroke="#64748b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M774,273 L787,286 L774,299" fill="none" stroke="#64748b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="600" y="500" font-size="13" fill="#0f172a" text-anchor="middle"><tspan font-weight="800" fill="#1d4ed8">The math: </tspan>200 prompts vs a normal 5 is a 40x spike.</text><text x="600" y="520" font-size="13" fill="#0f172a" text-anchor="middle"><tspan font-weight="800" fill="#1d4ed8"></tspan>Six templates in a fixed order is a near-unique fingerprint.</text></svg>