<svg viewBox="0 0 1200 540" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
<rect width="1200" height="540" fill="#ffffff"/><rect width="1200" height="540" fill="#f8fbff"/>
<rect x="0" y="0" width="10" height="540" fill="#1d4ed8"/>
<text x="600" y="46" font-size="28" font-weight="800" fill="#0f172a" text-anchor="middle">How a Model Reads You Without Reading Your Words</text>
<text x="600" y="76" font-size="16" fill="#64748b" text-anchor="middle">It sorts prompts by direction, then watches the clock.</text>
<rect x="64" y="100" width="520" height="372" rx="14" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.6"/><text x="324" y="134" font-size="17" font-weight="800" fill="#1e3a8a" text-anchor="middle">PROMPTS BECOME ARROWS</text><text x="324" y="156" font-size="13.5" fill="#1d4ed8" text-anchor="middle">same topic points the same way, no words needed</text><line x1="200" y1="320" x2="286" y2="197" stroke="#1d4ed8" stroke-width="4"/><path d="M286,197 L275,203 M286,197 L284,209" stroke="#1d4ed8" stroke-width="4"/><line x1="200" y1="320" x2="290" y2="213" stroke="#3b82f6" stroke-width="4"/><path d="M290,213 L279,217 M290,213 L287,224" stroke="#3b82f6" stroke-width="4"/><line x1="200" y1="320" x2="266" y2="206" stroke="#60a5fa" stroke-width="4"/><path d="M266,206 L256,212 M266,206 L265,218" stroke="#60a5fa" stroke-width="4"/><text x="360" y="210" font-size="14" font-weight="800" fill="#1e3a8a">topic A pile</text><line x1="200" y1="320" x2="343" y2="366" stroke="#b45309" stroke-width="4"/><path d="M343,366 L334,358 M343,366 L331,368" stroke="#b45309" stroke-width="4"/><line x1="200" y1="320" x2="328" y2="377" stroke="#d97706" stroke-width="4"/><path d="M328,377 L320,368 M328,377 L316,378" stroke="#d97706" stroke-width="4"/><text x="360" y="360" font-size="14" font-weight="800" fill="#b45309">topic B pile</text><circle cx="200" cy="320" r="5" fill="#0f172a"/><text x="324" y="452" font-size="13.5" fill="#64748b" text-anchor="middle">like sorting socks into color piles without seeing color</text><rect x="616" y="100" width="520" height="372" rx="14" fill="#fef2f2" stroke="#fecaca" stroke-width="1.6"/><text x="876" y="134" font-size="17" font-weight="800" fill="#991b1b" text-anchor="middle">TIMING GIVES IT AWAY</text><text x="876" y="156" font-size="13.5" fill="#b91c1c" text-anchor="middle">a sudden spike means something is happening</text><rect x="660" y="382" width="20" height="18" rx="3" fill="#fca5a5"/><rect x="690" y="380" width="20" height="20" rx="3" fill="#fca5a5"/><rect x="720" y="383" width="20" height="17" rx="3" fill="#fca5a5"/><rect x="750" y="381" width="20" height="19" rx="3" fill="#fca5a5"/><rect x="780" y="382" width="20" height="18" rx="3" fill="#fca5a5"/><rect x="810" y="379" width="20" height="21" rx="3" fill="#fca5a5"/><rect x="840" y="381" width="20" height="19" rx="3" fill="#fca5a5"/><rect x="878" y="210" width="34" height="190" rx="4" fill="#dc2626"/><text x="895" y="200" font-size="16" font-weight="800" fill="#dc2626" text-anchor="middle">40x</text><line x1="654" y1="400" x2="1096" y2="400" stroke="#cbd5e1"/><text x="750" y="420" font-size="13" fill="#64748b" text-anchor="middle">normal: ~5 questions a day</text><text x="895" y="420" font-size="13" fill="#dc2626" text-anchor="middle">today: 200</text><text x="876" y="452" font-size="13.5" fill="#64748b" text-anchor="middle">a deal, a filing, a launch, or a problem just landed</text><text x="600" y="512" font-size="15" fill="#0f172a" text-anchor="middle">Put the piles and the timing together and the model has a live map of how you work and what is next.</text></svg>