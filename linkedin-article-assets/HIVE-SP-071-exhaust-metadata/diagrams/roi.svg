<svg viewBox="0 0 1200 500" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
<rect width="1200" height="500" fill="#ffffff"/><rect width="1200" height="500" fill="#f8fbff"/>
<rect x="0" y="0" width="10" height="500" fill="#1d4ed8"/>
<text x="600" y="46" font-size="24" font-weight="800" fill="#0f172a" text-anchor="middle">You Can Lose the Same IP Twice</text>
<text x="600" y="74" font-size="13.5" fill="#64748b" text-anchor="middle">Once because you never captured it, once because you rendered it to someone else.</text>
<text x="140" y="150" font-size="15" font-weight="800" fill="#0f172a">Leak 1: the knowledge you never captured</text><rect x="140" y="168" width="920" height="40" rx="8" fill="#fee2e2"/><rect x="140" y="168" width="258" height="40" rx="8" fill="#047857"/><text x="150" y="194" font-size="15" font-weight="800" fill="#fff">28% kept as firm IP</text><text x="1050" y="194" font-size="14" font-weight="800" fill="#dc2626" text-anchor="end">72% walks out the door</text><text x="140" y="262" font-size="15" font-weight="800" fill="#0f172a">Leak 2: the exhaust you hand to an outside model</text><rect x="140" y="280" width="920" height="40" rx="8" fill="#fee2e2"/><text x="150" y="306" font-size="14.5" font-weight="700" fill="#7f1d1d">your methodology, rendered as metadata, to a model you do not control</text><rect x="140" y="356" width="920" height="86" rx="12" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/><text x="164" y="388" font-size="15" font-weight="800" fill="#1e3a8a">The fix: capture your own exhaust, inside your boundary</text><text x="164" y="414" font-size="13.5" fill="#1e40af">the telemetry a stranger could mine becomes reusable firm memory, compounding run over run</text><text x="600" y="470" font-size="13.5" fill="#0f172a" text-anchor="middle" font-style="italic">Illustrative; the 28% retention figure is from the referenced knowledge-capture analysis.</text></svg>