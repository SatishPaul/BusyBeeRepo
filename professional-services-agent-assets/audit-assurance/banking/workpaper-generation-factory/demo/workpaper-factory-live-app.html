  `<table><tr><th>Section</th><th>Type</th><th>Caption</th><th>Recorded</th><th>Source</th><th>Delta</th><th>Tie</th><th>Flag</th></tr>`+
  D.secs.map((s,i)=>`<tr class="row" onclick="go('section',${i})"><td>${s.pswp_sectionref} ${s.pswp_title}</td><td>${s.pswp_sectiontype}</td><td>${s.pswp_caption||''}</td><td>${money(s.pswp_recordedamount)}</td><td>${money(s.pswp_sourceamount)}</td><td class="${s.pswp_delta?'flag':''}">${money(s.pswp_delta)}</td><td>${s.pswp_tiestatus}</td><td class="${s.pswp_flagstatus==='Flagged'?'flag':'clean'}">${s.pswp_flagstatus}</td></tr>`).join('')+`</table>`;
 }else if(view.p==='section'){const s=D.secs[view.id];h+=`<div class="crumb"><b>Sections</b> &gt; ${s.pswp_sectionref}</div>`+
  `<div class="form"><div class="hd">${s.pswp_sectionref} &#183; ${s.pswp_title}</div><div class="grid2">`+
  `<div class="fld"><div class="l">Section Type</div><div class="v">${s.pswp_sectiontype}</div></div>`+
  `<div class="fld"><div class="l">Caption</div><div class="v">${s.pswp_caption||''}</div></div>`+
  `<div class="fld"><div class="l">Recorded Amount</div><div class="v">${money(s.pswp_recordedamount)}</div></div>`+
  `<div class="fld"><div class="l">Source Amount</div><div class="v">${money(s.pswp_sourceamount)}</div></div>`+
  `<div class="fld"><div class="l">Delta</div><div class="v ${s.pswp_delta?'flag':''}">${money(s.pswp_delta)}</div></div>`+
  `<div class="fld"><div class="l">Tie Status</div><div class="v">${s.pswp_tiestatus}</div></div>`+
  `<div class="fld" style="grid-column:1/3"><div class="l">Flag Status</div><div class="v ${s.pswp_flagstatus==='Flagged'?'flag':'clean'}">${s.pswp_flagstatus}</div></div>`+
  `<div class="fld" style="grid-column:1/3"><div class="l">Drafted Summary (written by the agent)</div><div class="v" style="font-weight:400;line-height:1.5">${s.pswp_draftedsummary||''}</div></div>`+
  `</div></div>`;
 }else if(view.p==='findings'){h+=`<div class="crumb"><b>Workpapers</b> &gt; Findings</div><h1>Findings (3)</h1>`+banner()+
  D.fnd.map(f=>{const sev=f.pswp_severity==='High'?'hi':f.pswp_severity==='Medium'?'med':'ok';return `<div class="form" style="margin-bottom:12px"><div class="hd" style="display:flex;justify-content:space-between"><span>${f.pswp_name}</span><span class="pill ${sev}" style="background:#fff;color:#a4262c">${f.pswp_severity} &#183; ${(+f.pswp_confidence).toFixed(1)}%</span></div><div class="fld" style="border:none"><div class="l">${f.pswp_type}</div><div class="v" style="font-weight:400;line-height:1.5">${f.pswp_description}</div></div></div>`}).join('');
 }else if(view.p==='agents'){h+=`<div class="crumb"><b>Workpapers</b> &gt; Agent Runs</div><h1>Agent Runs (7)</h1>`+banner()+
  `<table><tr><th>Agent</th><th>Role</th><th>Status</th><th>Tokens</th><th>Confidence</th></tr>`+
  D.ag.map(a=>`<tr><td><span class="dot" style="background:${a.pswp_role==='master'?'#047857':'#0891b2'}"></span>${a.pswp_name}</td><td><span class="pill ${a.pswp_role==='master'?'ok':''}" style="${a.pswp_role!=='master'?'background:#e5f2fb;color:#0b5cab':''}">${(a.pswp_role||'').toUpperCase()}</span></td><td class="clean">${a.pswp_status}</td><td>${(+a.pswp_tokens).toLocaleString('en-US')}</td><td>${(+a.pswp_confidence).toFixed(1)}%</td></tr>`).join('')+`</table>`;
 }
 m.innerHTML=h;m.scrollTop=0;
}
render();
</script></body></html>
